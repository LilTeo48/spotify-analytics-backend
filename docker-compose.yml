services:
  db:
    image: postgres:16
    container_name: spotify_postgres
    environment:
      POSTGRES_DB: spotify_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: spotify_api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/spotify_analytics

volumes:
  postgres_data: